[project]
name = "quenchz"
version = "0.1.0"
description = "An MCP server that stopped being a subprocess, and the four things it then has to decide."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Quelin Zammit" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# One HTTP client stack, not two, and that is a decision rather than an accident. The `mcp`
# SDK's own metadata names `httpx2>=2.5.0`, so a tree that also pulled `httpx` for its own
# requests would ship two clients, two connection pools and two sets of timeout semantics for
# one job. Nothing here depends on `httpx` and a test asserts it stays that way.
dependencies = [
    "mcp>=2.1.1",
    # Imported directly by scripts/capture.py, so it is declared directly. It also arrives
    # transitively through `mcp`, and relying on that would make this tree's HTTP client an
    # accident of somebody else's dependency list.
    "httpx2>=2.5.0",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pyjwt[crypto]>=2.9",
    "starlette>=0.40",
]

[project.urls]
Homepage = "https://github.com/PNX89/QUENCHZ"
Source = "https://github.com/PNX89/QUENCHZ"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quenchz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
files = ["src", "tests"]
strict = true
